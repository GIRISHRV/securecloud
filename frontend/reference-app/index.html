<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Management application</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app-v2.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">SC</div>
      <div>
        <strong id="app-name">Management application</strong>
      </div>
    </header>

    <div class="shell">
      <nav class="sidebar" aria-label="Application sections">
        <button class="nav-item is-active" type="button" data-view="overview">Overview</button>
        <div id="resource-navigation"></div>
      </nav>

      <main>
        <div class="page-heading">
          <div>
            <p class="eyebrow" id="profile-kind">Operations</p>
            <h1 id="view-title">Overview</h1>
            <p id="view-description">Loading application profile…</p>
          </div>
          <span class="health" id="health-status">Connecting</span>
        </div>

        <section id="overview-view" aria-labelledby="view-title">
          <div class="metrics" id="summary-metrics"></div>
          <div class="panel overview-note">
            <h2>Get started</h2>
            <p>Select a section from the navigation to add and manage records.</p>
          </div>
        </section>

        <section id="resource-view" hidden>
          <div class="toolbar">
            <p id="record-count">0 records</p>
            <button class="primary-button" id="open-form" type="button">Add</button>
          </div>

          <form class="panel record-form" id="record-form" hidden>
            <h2 id="form-title">Add record</h2>
            <div class="form-grid" id="record-fields"></div>
            <div class="form-actions">
              <button class="secondary-button" id="cancel-form" type="button">Cancel</button>
              <button class="primary-button" id="save-record" type="submit">Save</button>
            </div>
          </form>

          <div class="table-wrap">
            <table>
              <thead><tr id="records-head"></tr></thead>
              <tbody id="records-body"></tbody>
            </table>
            <p class="empty-message" id="empty-message">No records yet.</p>
          </div>
        </section>

        <p class="error-message" id="error-message" role="alert" hidden></p>
      </main>
    </div>
  </body>
</html>
