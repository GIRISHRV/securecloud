apiVersion: v1
kind: Namespace
metadata:
  name: securecloud-system
  labels:
    app.kubernetes.io/managed-by: securecloud
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: securecloud-backend
  namespace: securecloud-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: securecloud-backend
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    # delete is for removing a self-service shop; the admission policy below limits it to
    # SecureCloud-managed shop namespaces, so it can never touch system or testbed namespaces.
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Reach a tenant service through the API server proxy (order mirroring for self-service shops),
  # instead of a port-forward per shop. Narrower than the pods/exec already granted below.
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # Live lab harness only: runs server-built, allowlisted probe scripts inside
  # project-owned lab workloads (backend/lab). Remove for non-lab deployments.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: securecloud-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: securecloud-backend
subjects:
  - kind: ServiceAccount
    name: securecloud-backend
    namespace: securecloud-system
---
apiVersion: v1
kind: Secret
metadata:
  name: securecloud-backend-token
  namespace: securecloud-system
  annotations:
    kubernetes.io/service-account.name: securecloud-backend
type: kubernetes.io/service-account-token
---
# Kubernetes-enforced guard for the delete permission above: the backend may delete a namespace
# only if it is SecureCloud-managed and labelled kind=shop (a merchant shop tenant).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: securecloud-backend-deletes-only-shops
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["namespaces"]
  matchConditions:
    - name: securecloud-backend-only
      expression: "request.userInfo.username == 'system:serviceaccount:securecloud-system:securecloud-backend'"
  validations:
    - expression: >-
        has(oldObject.metadata.labels) &&
        oldObject.metadata.labels.exists(k, k == 'app.kubernetes.io/managed-by') &&
        oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'securecloud' &&
        oldObject.metadata.labels.exists(k, k == 'securecloud.io/kind') &&
        oldObject.metadata.labels['securecloud.io/kind'] == 'shop'
      message: "SecureCloud may delete only its own shop namespaces"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: securecloud-backend-deletes-only-shops
spec:
  policyName: securecloud-backend-deletes-only-shops
  validationActions: ["Deny"]
