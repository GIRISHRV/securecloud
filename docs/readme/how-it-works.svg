<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="How SecureCloud responds: compromise, blocked by policy, detected by AI, quarantined, restored">
  <defs>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .card { fill: #121a33; stroke: #24304f; stroke-width: 1.5; }
      .num { fill: #6b7cb0; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
      .h { fill: #eef2ff; font-size: 17px; font-weight: 700; }
      .p { fill: #93a0c4; font-size: 13px; }
      .rail { stroke: #24304f; stroke-width: 4; stroke-linecap: round; }
      .lit { stroke: url(#railgrad); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      .step { opacity: .5; animation: on 8s infinite; }
      .s1 { animation-delay: 0s; } .s2 { animation-delay: 1.4s; } .s3 { animation-delay: 2.8s; } .s4 { animation-delay: 4.2s; } .s5 { animation-delay: 5.6s; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 75%, 100% { stroke-dashoffset: 0; } }
      @keyframes on { 0% { opacity: .5; } 4%, 92% { opacity: 1; } 100% { opacity: .5; } }
      @media (prefers-reduced-motion: reduce) { .lit { animation: none; stroke-dashoffset: 0; } .step { animation: none; opacity: 1; } }
    </style>
    <linearGradient id="railgrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ff5b6e"/>
      <stop offset=".45" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#3ccf8e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="22" fill="#0b1020"/>
  <g class="t">
    <line class="rail" x1="120" y1="58" x2="1080" y2="58"/>
    <line class="lit" x1="120" y1="58" x2="1080" y2="58" pathLength="1000"/>

    <g class="step s1" transform="translate(30 0)">
      <circle cx="90" cy="58" r="22" fill="#ff5b6e"/><text x="90" y="65" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">1</text>
      <rect class="card" x="0" y="96" width="180" height="140" rx="14"/>
      <text class="num" x="16" y="122">STEP 1</text><text class="h" x="16" y="148">Compromise</text>
      <text class="p" x="16" y="174">A shop's plugin is</text><text class="p" x="16" y="192">hacked and tries to</text><text class="p" x="16" y="210">reach other tenants.</text>
    </g>
    <g class="step s2" transform="translate(270 0)">
      <circle cx="90" cy="58" r="22" fill="#ff7a59"/><text x="90" y="65" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">2</text>
      <rect class="card" x="0" y="96" width="180" height="140" rx="14"/>
      <text class="num" x="16" y="122">STEP 2</text><text class="h" x="16" y="148">Blocked</text>
      <text class="p" x="16" y="174">Default-deny Cilium</text><text class="p" x="16" y="192">policy drops it; Hubble</text><text class="p" x="16" y="210">records every verdict.</text>
    </g>
    <g class="step s3" transform="translate(510 0)">
      <circle cx="90" cy="58" r="22" fill="#ffb84d"/><text x="90" y="65" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">3</text>
      <rect class="card" x="0" y="96" width="180" height="140" rx="14"/>
      <text class="num" x="16" y="122">STEP 3</text><text class="h" x="16" y="148">Detected</text>
      <text class="p" x="16" y="174">A temporal-graph model</text><text class="p" x="16" y="192">flags the odd behaviour</text><text class="p" x="16" y="210">and opens an incident.</text>
    </g>
    <g class="step s4" transform="translate(750 0)">
      <circle cx="90" cy="58" r="22" fill="#5b8cff"/><text x="90" y="65" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">4</text>
      <rect class="card" x="0" y="96" width="180" height="140" rx="14"/>
      <text class="num" x="16" y="122">STEP 4</text><text class="h" x="16" y="148">Quarantined</text>
      <text class="p" x="16" y="174">One click withdraws its</text><text class="p" x="16" y="192">access, even paths it</text><text class="p" x="16" y="210">was allowed before.</text>
    </g>
    <g class="step s5" transform="translate(990 0)">
      <circle cx="90" cy="58" r="22" fill="#3ccf8e"/><text x="90" y="65" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">5</text>
      <rect class="card" x="0" y="96" width="180" height="140" rx="14"/>
      <text class="num" x="16" y="122">STEP 5</text><text class="h" x="16" y="148">Restored</text>
      <text class="p" x="16" y="174">After review it is</text><text class="p" x="16" y="192">restored, with a full</text><text class="p" x="16" y="210">audited evidence trail.</text>
    </g>
  </g>
</svg>
