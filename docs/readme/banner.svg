<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="SecureCloud: zero trust for shared clouds">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#18245a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#9db8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .node { fill: #121a33; stroke: #33427a; stroke-width: 2; }
      .lbl { fill: #c9d4f5; font-size: 13px; font-weight: 600; }
      .ok { stroke: #3ccf8e; stroke-width: 3; stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
      .bad { stroke: #ff5b6e; stroke-width: 3; stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
      .wall { stroke: #ff5b6e; stroke-width: 3; stroke-dasharray: 4 6; opacity: .8; }
      .x { animation: pulse 1.6s ease-in-out infinite; transform-origin: 1003px 196px; }
      .shield { animation: glow 3s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: .6; } }
      @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .ok, .bad, .x, .shield { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>

  <g class="t">
    <g transform="translate(64 92)">
      <rect width="52" height="52" rx="14" fill="#5b8cff"/>
      <text x="26" y="36" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">S</text>
    </g>
    <text x="134" y="132" fill="url(#title)" font-size="54" font-weight="800">SecureCloud</text>
    <text x="66" y="186" fill="#c9d4f5" font-size="24" font-weight="600">Many shops. One cloud. One gets hacked.</text>
    <text x="66" y="220" fill="#8fa0d0" font-size="18">SecureCloud stops the hacker from spreading.</text>
    <text x="66" y="276" fill="#6b7cb0" font-size="14" letter-spacing="1.5">ZERO TRUST · KUBERNETES · CILIUM eBPF · TEMPORAL-GRAPH AI</text>
  </g>

  <!-- mini service map: allowed traffic flows, the hacked plugin is stopped at the tenant wall -->
  <g class="t">
    <rect x="700" y="60" width="440" height="230" rx="18" fill="#0e1530" stroke="#24304f"/>
    <text x="722" y="88" fill="#6b7cb0" font-size="12" font-weight="700" letter-spacing="1">LIVE SERVICE MAP</text>

    <line class="ok" x1="790" y1="130" x2="880" y2="130"/>
    <line class="ok" x1="950" y1="130" x2="1050" y2="130"/>
    <line class="bad" x1="824" y1="236" x2="990" y2="200"/>
    <line class="wall" x1="1010" y1="100" x2="1010" y2="276"/>

    <rect class="node" x="722" y="112" width="68" height="36" rx="9"/><text class="lbl" x="756" y="135" text-anchor="middle">Shop</text>
    <rect class="node" x="880" y="112" width="70" height="36" rx="9"/><text class="lbl" x="915" y="135" text-anchor="middle">API</text>
    <rect class="node" x="1050" y="112" width="70" height="36" rx="9"/><text class="lbl" x="1085" y="135" text-anchor="middle">DB</text>
    <rect class="node" x="712" y="218" width="112" height="36" rx="9" stroke="#ff5b6e"/><text class="lbl" x="768" y="241" text-anchor="middle">Hacked plugin</text>
    <rect class="node" x="1040" y="218" width="84" height="36" rx="9"/><text class="lbl" x="1082" y="241" text-anchor="middle">Other shop</text>

    <g class="x">
      <circle cx="1003" cy="196" r="13" fill="#ff5b6e"/>
      <path d="M997 190l12 12M1009 190l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="1022" y="190" fill="#ff8a98" font-size="12" font-weight="700">blocked</text>
    <g class="shield" transform="translate(1086 72)">
      <path d="M12 0l12 5v8c0 8-5 13-12 16C5 26 0 21 0 13V5z" fill="#3ccf8e"/>
    </g>
  </g>
</svg>
